<aside class="sidebar">
  <div class="d-flex align-items-center gap-2 px-3 pt-3 pb-3">
    <div class="brand-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3C7 7 6 13 8 19" />
        <path d="M12 3c5 4 6 10 4 16" opacity="0.8" />
        <path d="M12 3v18" opacity="0.55" />
      </svg>
    </div>
    <div>
      <div class="fw-bold lh-1" style="letter-spacing: -0.01em">El Sauce</div>
      <div class="text-secondary text-uppercase fw-semibold" style="font-size: .62rem; letter-spacing: .05em">Funeraria</div>
    </div>
  </div>

  <nav class="flex-grow-1 overflow-auto px-2 pb-2 content-scroll">
    <div class="mt-3" *ngFor="let group of nav">
      <div class="nav-section">{{ group.group }}</div>
      <button
        type="button"
        class="nav-link-sb"
        [class.active]="currentView === item.id"
        *ngFor="let item of group.items"
        [routerLink]="['/', item.id]"
      >
        <i class="bi" [ngClass]="'bi-' + item.icon"></i>
        <span>{{ item.label }}</span>
        <span class="nav-count tnum" *ngIf="item.count != null">{{ item.count }}</span>
      </button>
    </div>
  </nav>

  <div class="border-top p-2">
    <div class="d-flex align-items-center gap-2 p-2 rounded-3">
      <app-avatar [name]="userName" [size]="36"></app-avatar>
      <div class="flex-grow-1" style="min-width: 0">
        <div class="fw-bold text-truncate" style="font-size: .85rem">{{ userName }}</div>
        <div class="text-secondary text-truncate" style="font-size: .75rem">{{ userEmail }}</div>
      </div>
      <button
        type="button"
        class="btn btn-soft icon-btn"
        title="Cerrar sesion"
        aria-label="Cerrar sesion"
        (click)="logout()"
        [disabled]="loggingOut"
      >
        <i class="bi bi-box-arrow-right text-secondary"></i>
      </button>
    </div>
  </div>
</aside>
