<div class="content-wrap">
  <app-page-head title="Clientes" sub="{{ clients.length }} familias registradas">
    <button class="btn btn-primary d-inline-flex align-items-center gap-2"><i class="bi bi-plus-lg"></i>Nuevo cliente</button>
  </app-page-head>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th class="ps-4">Cliente</th>
            <th>RUT</th>
            <th>Contacto</th>
            <th>Comuna</th>
            <th class="text-center">Servicios</th>
            <th class="pe-4">Último folio</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let client of clients; trackBy: trackByRut">
            <td class="ps-4">
              <div class="d-flex align-items-center gap-2">
                <app-avatar [name]="client.name" [size]="34"></app-avatar>
                <div>
                  <div class="fw-bold">{{ client.name }}</div>
                  <div class="text-secondary" style="font-size: .75rem">{{ client.email }}</div>
                </div>
              </div>
            </td>
            <td class="tnum text-body-secondary">{{ client.rut }}</td>
            <td class="tnum text-body-secondary">{{ client.telefono }}</td>
            <td class="text-body-secondary">{{ client.comuna }}</td>
            <td class="text-center"><app-badge cls="b-neutral">{{ client.casos }}</app-badge></td>
            <td class="pe-4 tnum fw-bold text-primary">{{ client.ultimo }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
