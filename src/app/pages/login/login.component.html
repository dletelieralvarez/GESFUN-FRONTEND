<div class="login-page d-flex justify-content-center align-items-center min-vh-100 px-3">
  <div class="login-card card shadow p-4 w-100" style="max-width: 560px;">
    <div class="login-header text-center mb-5">
      <div class="login-logo mb-3">GF</div>
      <div class="login-badge mb-3">Acceso corporativo</div>
      <h2 class="fw-bold mb-2">Bienvenido a GesFun</h2>      
    </div>

    <div class="d-grid mb-3">
      <button class="btn btn-ms btn-lg" type="button" (click)="login()" [disabled]="loading">
        <i class="bi bi-person-check"></i>
        Iniciar sesion con Microsoft
      </button>
    </div>

    <div class="d-grid gap-2 mb-3" *ngIf="account">
      <button class="btn btn-outline-secondary" type="button" (click)="logout()" [disabled]="loading">
        Cerrar sesion
      </button>
    </div>

    <div *ngIf="loading" class="alert alert-info py-2 mb-3">Cargando...</div>
    <div *ngIf="error" class="alert alert-danger py-2 mb-3">{{ error }}</div>
    <div *ngIf="info" class="alert alert-warning py-2 mb-3">
      <i class="bi bi-exclamation-triangle me-2"></i>{{ info }}
    </div>
  </div>
</div>
